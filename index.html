<!DOCTYPE html>

<title>G04EggX – Eier-Timer</title>
<meta name="description" content="G04EggX – der futuristische Eier-Timer für dein iPhone." />
<link rel="manifest" href="manifest.json" />

<!-- Favicon (Browser-Tab) -->

    --safe-right: env(safe-area-inset-right, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --safe-left: env(safe-area-inset-left, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body, #root { width: 100%; height: 100%; margin: 0; padding: 0; background: #000; overflow: hidden; }
  body { min-height: 100vh; min-height: 100dvh; overscroll-behavior: none; }
  button { touch-action: manipulation; }

<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useCallback } = React;

/* Kleine Inline-Icons statt lucide-react (damit die Datei ohne Build laeuft) */
function Play({ size = 18 }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="currentColor">
      <path d="M8 5v14l11-7z" />
    </svg>
  );
}
function Pause({ size = 18 }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="currentColor">
      <path d="M6 5h4v14H6zM14 5h4v14h-4z" />
    </svg>
  );
}
function RotateCcw({ size = 18 }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
      <path d="M3 12a9 9 0 1 0 3-6.7" />
      <path d="M3 4v5h5" />
    </svg>
  );
}
function Volume2({ size = 14 }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
      <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor" stroke="none" />
      <path d="M15.5 8.5a5 5 0 0 1 0 7" />
      <path d="M18.5 5.5a9 9 0 0 1 0 13" />
    </svg>
  );
}
const PRESETS = [
  { id: "wachsweich", label: "Wachsw.", minutes: 4, neon: "#00FFC6", neon2: "#00B88F", finalHardness: 0.32 },
  { id: "weich", label: "Weich", minutes: 5, neon: "#00F0FF", neon2: "#00A8FF", finalHardness: 0.5 },
  { id: "mittel", label: "Mittel", minutes: 7, neon: "#FF6BFF", neon2: "#B026FF", finalHardness: 0.72 },
  { id: "hart", label: "Hart", minutes: 10, neon: "#FF2D6B", neon2: "#FF0044", finalHardness: 0.9 },
  { id: "sehrhart", label: "S. Hart", minutes: 12, neon: "#FF7A00", neon2: "#FF3D00", finalHardness: 1 },
];

const SOUNDS = [
  { id: "chime", label: "Chime" },
  { id: "beep", label: "Beep" },
  { id: "melodie", label: "Melodie" },
  { id: "puls", label: "Puls" },
  { id: "sirene", label: "Sirene" },
];

const PUSH_API_URL = String(window.EGGX_PUSH_API || "").replace(/\/$/, "");

function isIOSDevice() {
  return /iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
}

function isStandaloneApp() {
  return window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
}

function pushSupported() {
  return "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
}

function base64UrlToBytes(value) {
  const padding = "=".repeat((4 - value.length % 4) % 4);
  const binary = atob((value + padding).replace(/-/g, "+").replace(/_/g, "/"));
  return Uint8Array.from(binary, (char) => char.charCodeAt(0));
}

function randomBase64Url(length) {
  const values = crypto.getRandomValues(new Uint8Array(length));
  let binary = "";
  values.forEach((value) => { binary += String.fromCharCode(value); });
  return btoa(binary).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}

function getPushIdentity() {
  let deviceId = localStorage.getItem("eggx_pushDeviceId");
  let deviceSecret = localStorage.getItem("eggx_pushDeviceSecret");
  if (!deviceId) {
    deviceId = crypto.randomUUID ? crypto.randomUUID() : randomBase64Url(18);
    localStorage.setItem("eggx_pushDeviceId", deviceId);
  }
  if (!deviceSecret) {
    deviceSecret = randomBase64Url(32);
    localStorage.setItem("eggx_pushDeviceSecret", deviceSecret);
  }
  return { deviceId, deviceSecret };
}

async function pushRequest(path, options = {}) {
  if (!PUSH_API_URL) throw new Error("Der Push-Server ist noch nicht konfiguriert.");
  const { deviceSecret } = getPushIdentity();
  const response = await fetch(PUSH_API_URL + path, {
    ...options,
    headers: {
      "Content-Type": "application/json",
      Authorization: `Bearer ${deviceSecret}`,
      ...(options.headers || {}),
    },
  });
  if (!response.ok) {
    const detail = await response.json().catch(() => ({}));
    throw new Error(detail.error || "Der Push-Server ist nicht erreichbar.");
  }
  return response.json().catch(() => ({}));
}

function formatTime(totalSeconds) {
  const m = Math.floor(totalSeconds / 60);
  const s = totalSeconds % 60;
  return `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
}

function hexToRgb(hex) {
  const clean = hex.replace("#", "");
  const num = parseInt(clean, 16);
  return [(num >> 16) & 255, (num >> 8) & 255, num & 255];
}

function lerpColor(hexA, hexB, t) {
  const [r1, g1, b1] = hexToRgb(hexA);
  const [r2, g2, b2] = hexToRgb(hexB);
  const r = Math.round(r1 + (r2 - r1) * t);
  const g = Math.round(g1 + (g2 - g1) * t);
  const b = Math.round(b1 + (b2 - b1) * t);
  return `rgb(${r}, ${g}, ${b})`;
}

function playSound(soundId, ctx) {
  try {
    if (!ctx) return;
    if (ctx.state === "suspended") {
      ctx.resume();
    }

    const tone = (freq, start, dur, type = "sine", peak = 0.22) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.0001, ctx.currentTime + start);
      gain.gain.linearRampToValueAtTime(peak, ctx.currentTime + start + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + start + dur);
      osc.connect(gain).connect(ctx.destination);
      osc.start(ctx.currentTime + start);
      osc.stop(ctx.currentTime + start + dur + 0.05);
    };

    if (soundId === "beep") {
      tone(880, 0, 0.4, "square", 0.15);
    } else if (soundId === "melodie") {
      [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(f, i * 0.16, 0.35));
    } else if (soundId === "puls") {
      [440, 660, 440, 880].forEach((f, i) => tone(f, i * 0.14, 0.24, "sine", 0.2));
    } else if (soundId === "sirene") {
      [740, 988, 740, 988, 740].forEach((f, i) => tone(f, i * 0.11, 0.2, "sawtooth", 0.12));
    } else {
      [660, 880, 1320].forEach((f, i) => tone(f, i * 0.18, 0.5));
    }
  } catch (e) {
    /* Audio nicht verfuegbar */
  }
}

function G04EggX() {
  const [presetId, setPresetId] = useState("mittel");
  const preset = PRESETS.find((p) => p.id === presetId);
  const total = preset.minutes * 60;

  const [soundId, setSoundId] = useState(() => localStorage.getItem("eggx_soundId") || "chime");
  const [remaining, setRemaining] = useState(total);
  const [running, setRunning] = useState(false);
  const [done, setDone] = useState(false);
  const [pushEnabled, setPushEnabled] = useState(() => localStorage.getItem("eggx_pushEnabled") === "true");
  const [pushStatus, setPushStatus] = useState("");
  const intervalRef = useRef(null);
  const alarmIntervalRef = useRef(null);
  const audioCtxRef = useRef(null);
  const serviceWorkerRef = useRef(null);
  const soundIdRef = useRef(soundId);
  const endTimeRef = useRef(null); // Zielzeitpunkt (Date.now() + Restzeit), nicht einfach runterzaehlen

  useEffect(() => {
    soundIdRef.current = soundId;
    localStorage.setItem("eggx_soundId", soundId);
  }, [soundId]);

  useEffect(() => {
    if (!PUSH_API_URL) {
      setPushStatus("Push-Server noch nicht verbunden");
    } else if (!pushSupported()) {
      setPushStatus(isIOSDevice() && !isStandaloneApp() ? "Für Push zum Home-Bildschirm hinzufügen" : "Push wird nicht unterstützt");
    } else if (Notification.permission === "denied") {
      setPushStatus("");
    } else {
      setPushStatus(pushEnabled ? "Mitteilungen aktiv" : "Mitteilungen werden beim ersten Start aktiviert");
    }
  }, [pushEnabled]);

  useEffect(() => {
    if (!("serviceWorker" in navigator)) return;
    navigator.serviceWorker.register("./sw.js?v=1", { updateViaCache: "none" })
      .then(async (registration) => {
        serviceWorkerRef.current = registration;
        await registration.update();
      })
      .catch(() => setPushStatus("Offline-Funktion konnte nicht gestartet werden"));
  }, []);

  const clearAlarm = useCallback(() => {
    if (alarmIntervalRef.current) {
      clearInterval(alarmIntervalRef.current);
      alarmIntervalRef.current = null;
    }
  }, []);

  const finishTimer = useCallback(() => {
    clearInterval(intervalRef.current);
    setRunning(false);
    setDone(true);
    setRemaining(0);
    if (audioCtxRef.current && audioCtxRef.current.state === "suspended") {
      audioCtxRef.current.resume();
    }
    playSound(soundIdRef.current, audioCtxRef.current);
    if (navigator.vibrate) navigator.vibrate([300, 150, 300, 150, 600]);
    clearAlarm();
    alarmIntervalRef.current = setInterval(() => {
      playSound(soundIdRef.current, audioCtxRef.current);
      if (navigator.vibrate) navigator.vibrate([300, 150, 300]);
    }, 1800);
  }, [clearAlarm]);

  const tick = useCallback(() => {
    if (!endTimeRef.current) return;
    const secondsLeft = Math.max(0, Math.round((endTimeRef.current - Date.now()) / 1000));
    setRemaining(secondsLeft);
    if (secondsLeft <= 0) {
      finishTimer();
    }
  }, [finishTimer]);

  const selectPreset = useCallback((id) => {
    clearAlarm();
    cancelPushSchedule().catch(() => {});
    setPresetId(id);
    const p = PRESETS.find((x) => x.id === id);
    endTimeRef.current = null;
    setRemaining(p.minutes * 60);
    setRunning(false);
    setDone(false);
  }, [clearAlarm]);

  const unlockAudio = useCallback(() => {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!audioCtxRef.current) {
      audioCtxRef.current = new Ctx();
    }
    if (audioCtxRef.current.state === "suspended") {
      audioCtxRef.current.resume();
    }
    const buffer = audioCtxRef.current.createBuffer(1, 1, 22050);
    const src = audioCtxRef.current.createBufferSource();
    src.buffer = buffer;
    src.connect(audioCtxRef.current.destination);
    src.start(0);
  }, []);

  const getPushRegistration = useCallback(async () => {
    if (serviceWorkerRef.current) return serviceWorkerRef.current;
    if (!("serviceWorker" in navigator)) throw new Error("Service Worker werden nicht unterstützt.");
    const registration = await navigator.serviceWorker.ready;
    serviceWorkerRef.current = registration;
    return registration;
  }, []);

  const syncPushSchedule = useCallback(async (triggerAt, subscription) => {
    if (!PUSH_API_URL) return;
    const registration = await getPushRegistration();
    const activeSubscription = subscription || await registration.pushManager.getSubscription();
    if (!activeSubscription) throw new Error("Keine aktive Push-Anmeldung gefunden.");
    const { deviceId } = getPushIdentity();
    await pushRequest(`/api/devices/${encodeURIComponent(deviceId)}`, {
      method: "PUT",
      body: JSON.stringify({
        subscription: activeSubscription.toJSON(),
        timer: {
          enabled: Boolean(triggerAt),
          triggerAt: triggerAt || 0,
          presetId: preset.id,
          presetLabel: preset.label,
        },
      }),
    });
    setPushStatus(triggerAt ? "Mitteilung für Timerende geplant" : "Mitteilungen aktiv");
  }, [getPushRegistration, preset.id, preset.label, pushEnabled]);

  const cancelPushSchedule = useCallback(async () => {
    if (!PUSH_API_URL || !pushEnabled) return;
    await syncPushSchedule(null);
  }, [pushEnabled, syncPushSchedule]);

  const enableBackgroundPush = useCallback(async () => {
    if (!PUSH_API_URL) throw new Error("Der Cloudflare Push-Server ist noch nicht verbunden.");
    if (!pushSupported()) {
      if (isIOSDevice() && !isStandaloneApp()) throw new Error("G04EggX zuerst zum iPhone-Home-Bildschirm hinzufügen und von dort öffnen.");
      throw new Error("Dieser Browser unterstützt keine Hintergrund-Mitteilungen.");
    }
    if (isIOSDevice() && !isStandaloneApp()) throw new Error("G04EggX zuerst zum iPhone-Home-Bildschirm hinzufügen und von dort öffnen.");
    const permission = await Notification.requestPermission();
    if (permission !== "granted") throw new Error("Mitteilungen wurden nicht erlaubt.");
    const keyResponse = await fetch(`${PUSH_API_URL}/vapid-public-key`);
    if (!keyResponse.ok) throw new Error("Der Push-Server ist nicht erreichbar.");
    const { publicKey } = await keyResponse.json();
    if (!publicKey) throw new Error("Der Push-Server ist noch nicht vollständig eingerichtet.");
    const registration = await getPushRegistration();
    let subscription = await registration.pushManager.getSubscription();
    if (!subscription) {
      subscription = await registration.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: base64UrlToBytes(publicKey),
      });
    }
    await syncPushSchedule(running && endTimeRef.current ? endTimeRef.current : null, subscription);
    localStorage.setItem("eggx_pushEnabled", "true");
    setPushEnabled(true);
  }, [getPushRegistration, running, syncPushSchedule]);

  useEffect(() => {
    if (running) {
      if (!endTimeRef.current) endTimeRef.current = Date.now() + remaining * 1000;
      intervalRef.current = setInterval(tick, 1000);

      const handleVisibility = () => {
        if (document.visibilityState === "visible") tick();
      };
      document.addEventListener("visibilitychange", handleVisibility);

      return () => {
        clearInterval(intervalRef.current);
        document.removeEventListener("visibilitychange", handleVisibility);
      };
    }
  }, [running]);

  useEffect(() => () => clearAlarm(), [clearAlarm]);

  const toggleRunning = async () => {
    if (done) {
      clearAlarm();
      setDone(false);
      return;
    }
    if (remaining === 0) return;
    unlockAudio();
    clearAlarm();
    if (running) {
      if (endTimeRef.current) setRemaining(Math.max(0, Math.round((endTimeRef.current - Date.now()) / 1000)));
      endTimeRef.current = null;
      setRunning(false);
      cancelPushSchedule().catch(() => setPushStatus("Hintergrund-Timer konnte nicht angehalten werden"));
      return;
    }
    const triggerAt = Date.now() + remaining * 1000;
    endTimeRef.current = triggerAt;
    setRunning(true);
    if (pushEnabled) {
      syncPushSchedule(triggerAt).catch((error) => setPushStatus(error.message || "Hintergrund-Timer konnte nicht geplant werden"));
    } else if (PUSH_API_URL) {
      // Die erste Nutzeraktion darf die iOS/Android-Berechtigungsabfrage öffnen.
      // Danach werden Push-Anmeldung und Timer automatisch synchronisiert.
      enableBackgroundPush()
        .then(() => {
          if (endTimeRef.current === triggerAt) return syncPushSchedule(triggerAt);
        })
        .catch((error) => setPushStatus(error.message || "Mitteilungen konnten nicht aktiviert werden"));
    } else {
      setPushStatus("Push-Server noch nicht verbunden");
    }
  };

  const reset = () => {
    clearAlarm();
    cancelPushSchedule().catch(() => {});
    endTimeRef.current = null;
    setRunning(false);
    setDone(false);
    setRemaining(total);
  };

  const progress = 1 - remaining / total;
  const glowColor = done ? preset.neon2 : preset.neon;

  const yolkProgress = progress * preset.finalHardness;
  const yolkRadius = 66 - yolkProgress * 40;
  const yolkCenter = lerpColor("#FFDD55", "#F4C542", yolkProgress);
  const yolkEdge = lerpColor("#FF8C1A", "#B8712A", yolkProgress);
  const yolkHighlight = 0.55 - yolkProgress * 0.45;
  const yolkWobble = running ? (0.34 * (1 - yolkProgress)).toFixed(3) : "0";
  const yolkLiquidScale = 58 * (1 - yolkProgress);

  return (
    <div
      className="w-full h-full flex items-center justify-center relative overflow-hidden"
      style={{ width: "100vw", height: "100dvh", background: "#000000" }}
      onClick={() => {
        if (done) {
          clearAlarm();
          setDone(false);
        }
      }}
    >
      <div
        className="app-shell w-full bg-[#0B0D1F]/40 relative z-10 flex flex-col"
      >
        <div className="app-content w-full h-full mx-auto flex flex-col" style={{ maxWidth: "430px" }}>
          <div className="flex items-center justify-between mb-2 shrink-0">
            <span className="font-mono text-lg tracking-[0.15em] font-bold" style={{ color: glowColor, textShadow: `0 0 12px ${glowColor}` }}>
              G04EggX
            </span>
            <span
              className="text-[10px] uppercase tracking-[0.25em] font-bold px-2.5 py-1 rounded-full border"
              style={{ color: glowColor, borderColor: `${glowColor}66`, textShadow: `0 0 8px ${glowColor}` }}
            >
              {done ? "Fertig" : running ? "Kocht" : "Bereit"}
            </span>
          </div>

          <div className="egg-stage relative flex flex-1 min-h-0 flex-col items-center justify-center mb-2">
            {running && (
              <div className="absolute inset-0 pointer-events-none" aria-hidden="true">
                {Array.from({ length: 30 }).map((_, i) => {
                  const left = -4 + i * 3.7;
                  const dir = i % 2 === 0 ? 1 : -1;
                  const size = 9 + ((i * 7) % 7);
                  const delay = (i * 0.11) % 1.3;
                  return (
                    <span
                      key={i}
                      className="absolute block rounded-full"
                      style={{
                        left: `${left}%`,
                        bottom: "8%",
                        width: `${size}px`,
                        height: `${size}px`,
                        background: "radial-gradient(circle, rgba(235,232,222,0.95) 0%, rgba(235,232,222,0) 72%)",
                        opacity: 0,
                        "--dir": dir,
                        animation: `smokeRise 2.2s ease-out ${delay}s infinite`,
                      }}
                    />
                  );
                })}
              </div>
            )}

            <svg
              viewBox="0 0 160 192"
              style={
                running
                  ? {
                      width: "clamp(136px, 45vw, 225px)",
                      maxHeight: "min(37dvh, 245px)",
                      height: "auto",
                      animationName: "eggBoil, eggPulse",
                      animationDuration: `${(1.9 - progress * 1.2).toFixed(2)}s, ${(2.6 - progress * 1.2).toFixed(2)}s`,
                      animationTimingFunction: "ease-in-out, ease-in-out",
                      animationIterationCount: "infinite, infinite",
                      "--amt": (progress * 1.5).toFixed(2),
                    }
                  : done
                  ? {
                      width: "clamp(136px, 45vw, 225px)",
                      maxHeight: "min(37dvh, 245px)",
                      height: "auto",
                      animationName: "eggAlarmJump, eggPulse",
                      animationDuration: "0.5s, 0.5s",
                      animationTimingFunction: "ease-in-out, ease-in-out",
                      animationIterationCount: "infinite, infinite",
                    }
                  : {
                      width: "clamp(136px, 45vw, 225px)",
                      maxHeight: "min(37dvh, 245px)",
                      height: "auto",
                      animationName: "eggFloat",
                      animationDuration: "3.6s",
                      animationTimingFunction: "ease-in-out",
                      animationIterationCount: "infinite",
                    }
              }
            >
              <defs>
                <clipPath id="eggClipBig">
                  <path d="M80 8 C118 8 144 70 144 116 C144 156 116 184 80 184 C44 184 16 156 16 116 C16 70 42 8 80 8 Z" />
                </clipPath>
                <radialGradient id="yolkGrad" cx="35%" cy="30%" r="75%">
                  <stop offset="0%" stopColor={yolkCenter} />
                  <stop offset="100%" stopColor={yolkEdge} />
                </radialGradient>
                <filter id="yolkLiquid" x="-60%" y="-60%" width="220%" height="220%">
                  <feTurbulence type="fractalNoise" baseFrequency="0.014" numOctaves="2" seed="3" result="turb">
                    <animate attributeName="baseFrequency" values="0.01;0.026;0.01" dur="26s" repeatCount="indefinite" />
                  </feTurbulence>
                  <feDisplacementMap in="SourceGraphic" in2="turb" scale={yolkLiquidScale} xChannelSelector="R" yChannelSelector="G" />
                </filter>
              </defs>

              <g clipPath="url(#eggClipBig)">
                <path
                  d="M80 8 C118 8 144 70 144 116 C144 156 116 184 80 184 C44 184 16 156 16 116 C16 70 42 8 80 8 Z"
                  fill="#FFFFFF"
                  stroke="#E7E2D2"
                  strokeWidth="2.5"
                />
                {running && (
                  <rect x="0" y="0" width="160" height="10" fill={glowColor} opacity="0.35" style={{ animation: "scanLine 5s linear infinite" }} />
                )}
                <g
                  style={{
                    transformOrigin: "80px 100px",
                    animation: running ? "yolkWobble 13s ease-in-out infinite" : "none",
                    "--wobble": yolkWobble,
                  }}
                >
                  <circle cx="80" cy="100" r={yolkRadius} fill="url(#yolkGrad)" stroke="rgba(0,0,0,0.18)" strokeWidth="1" filter="url(#yolkLiquid)" />
                  <ellipse
                    cx={80 - yolkRadius * 0.35}
                    cy={100 - yolkRadius * 0.4}
                    rx={yolkRadius * 0.32}
                    ry={yolkRadius * 0.2}
                    fill="#FFFFFF"
                    opacity={yolkHighlight}
                  />
                </g>
              </g>
            </svg>

            <div
              className="mt-3 font-mono tabular-nums tracking-tight font-bold"
              style={{ fontSize: "clamp(28px, 9vw, 40px)", color: "#F4F6FF", textShadow: `0 0 18px ${glowColor}99, 0 0 4px ${glowColor}` }}
            >
              {formatTime(remaining)}
            </div>
            <div className="mt-2 text-sm font-medium" style={{ color: glowColor }}>
              {preset.label} · {preset.minutes} Min
            </div>
          </div>

          {done && (
            <div
              className="mb-2 rounded-xl px-3 py-1.5 text-xs text-center font-semibold border shrink-0"
              style={{ backgroundColor: `${glowColor}1A`, color: glowColor, borderColor: `${glowColor}55` }}
              role="status"
              aria-live="assertive"
            >
              Dein Ei ist perfekt {preset.label.toLowerCase()} gekocht 🥚
            </div>
          )}

          <div className="grid grid-cols-5 gap-1.5 mb-2 shrink-0">
            {PRESETS.map((p) => (
              <button
                key={p.id}
                onClick={() => selectPreset(p.id)}
                className="min-w-0 rounded-lg px-1 py-2 text-[10px] sm:text-xs font-bold border transition-all focus:outline-none focus-visible:ring-2 focus-visible:ring-offset-2 focus-visible:ring-offset-[#0B0D1F]"
                style={{
                  borderColor: p.id === presetId ? p.neon : "#2A2C45",
                  backgroundColor: p.id === presetId ? `${p.neon}1A` : "transparent",
                  color: p.id === presetId ? p.neon : "#7A7E9E",
                  boxShadow: p.id === presetId ? `0 0 16px -4px ${p.neon}99` : "none",
                }}
              >
                {p.label}
                <span className="block text-[10px] opacity-80 font-normal">{p.minutes} Min</span>
              </button>
            ))}
          </div>

          <div className="grid grid-cols-5 gap-1.5 mb-2 shrink-0" aria-label="Alarmton">
            {SOUNDS.map((s) => (
              <button
                key={s.id}
                onClick={() => setSoundId(s.id)}
                className="min-w-0 truncate rounded-lg px-1 py-1.5 text-[10px] font-semibold border transition-all focus:outline-none focus-visible:ring-2 focus-visible:ring-offset-2 focus-visible:ring-offset-[#0B0D1F]"
                style={{
                  borderColor: s.id === soundId ? glowColor : "#2A2C45",
                  color: s.id === soundId ? glowColor : "#7A7E9E",
                  backgroundColor: s.id === soundId ? `${glowColor}1A` : "transparent",
                }}
              >
                {s.label}
              </button>
            ))}
          </div>

          {pushStatus && (
            <p className="mb-2 truncate text-center text-[10px] text-[#7A7E9E]" title={pushStatus} aria-live="polite">{pushStatus}</p>
          )}

          <div className="flex items-center gap-3 shrink-0">
            <button
              onClick={toggleRunning}
              disabled={remaining === 0 && !done}
              className="flex-1 flex items-center justify-center gap-2 rounded-xl py-2.5 font-bold text-[#05060F] disabled:opacity-40 focus:outline-none focus-visible:ring-2 focus-visible:ring-offset-2 focus-visible:ring-offset-[#0B0D1F]"
              style={{ background: `linear-gradient(90deg, ${preset.neon}, ${preset.neon2})`, boxShadow: `0 0 24px -4px ${glowColor}aa` }}
            >
              {running ? <Pause size={18} /> : <Play size={18} />}
              {done ? "Stopp" : running ? "Pause" : remaining === total ? "Start" : "Weiter"}
            </button>
            <button
              onClick={reset}
              className="rounded-xl border p-3 hover:bg-white/5 focus:outline-none focus-visible:ring-2 focus-visible:ring-offset-2 focus-visible:ring-offset-[#0B0D1F]"
              style={{ borderColor: "#2A2C45", color: glowColor }}
              aria-label="Zuruecksetzen"
            >
              <RotateCcw size={18} />
            </button>
          </div>
          <div className="pt-1 text-center text-[9px] text-[#7A7E9E] shrink-0">
            <a href="./datenschutz.html" className="underline-offset-2 hover:underline">Datenschutz</a>
            <span aria-hidden="true"> · </span>
            <a href="./impressum.html" className="underline-offset-2 hover:underline">Impressum / Copyright</a>
          </div>
        </div>
      </div>

      <style>{`
        .app-shell {
          height: 100dvh;
          padding-top: max(12px, var(--safe-top));
          padding-right: max(14px, var(--safe-right));
          padding-bottom: max(12px, var(--safe-bottom));
          padding-left: max(14px, var(--safe-left));
        }
        @keyframes eggFloat {
          0%, 100% { transform: translateY(0) rotate(0deg); }
          50% { transform: translateY(-10px) rotate(0deg); }
        }
        @keyframes smokeRise {
          0% { transform: translate(0, 0) scale(0.6); opacity: 0; filter: blur(0.5px); }
          12% { opacity: 0.95; }
          45% { transform: translate(calc(var(--dir, 1) * 14px), -70px) scale(1.3); opacity: 0.7; filter: blur(1.5px); }
          75% { transform: translate(calc(var(--dir, 1) * -12px), -130px) scale(2); opacity: 0.4; filter: blur(2.5px); }
          100% { transform: translate(calc(var(--dir, 1) * 10px), -195px) scale(2.6); opacity: 0; filter: blur(3.5px); }
        }
        @keyframes eggBoil {
          0% { transform: translateY(0) rotate(0deg); }
          20% { transform: translateY(calc(-7px * var(--amt, 1))) rotate(calc(-3deg * var(--amt, 1))); }
          40% { transform: translateY(calc(1px * var(--amt, 1))) rotate(calc(2deg * var(--amt, 1))); }
          60% { transform: translateY(calc(-9px * var(--amt, 1))) rotate(calc(-2deg * var(--amt, 1))); }
          80% { transform: translateY(calc(2px * var(--amt, 1))) rotate(calc(3deg * var(--amt, 1))); }
          100% { transform: translateY(0) rotate(0deg); }
        }
        @keyframes eggAlarmJump {
          0% { transform: translate(0, 0) rotate(0deg); }
          15% { transform: translate(-10px, -22px) rotate(-10deg); }
          30% { transform: translate(8px, 2px) rotate(8deg); }
          45% { transform: translate(-6px, -16px) rotate(-6deg); }
          60% { transform: translate(10px, 0) rotate(10deg); }
          75% { transform: translate(-8px, -20px) rotate(-8deg); }
          90% { transform: translate(4px, 2px) rotate(4deg); }
          100% { transform: translate(0, 0) rotate(0deg); }
        }
        @keyframes eggPulse {
          0%, 100% { filter: brightness(1); }
          50% { filter: brightness(1.15); }
        }
        @keyframes yolkWobble {
          0%, 100% { transform: scale(1, 1); }
          50% { transform: scale(calc(1 + var(--wobble)), calc(1 - var(--wobble))); }
        }
        @keyframes scanLine {
          0% { transform: translateY(-10px); opacity: 0; }
          15% { opacity: 0.6; }
          85% { opacity: 0.6; }
          100% { transform: translateY(190px); opacity: 0; }
        }
        div[style*="scrollbar-width"]::-webkit-scrollbar { display: none; }
        @media (max-height: 700px) {
          .app-shell { padding-top: max(8px, var(--safe-top)); padding-bottom: max(8px, var(--safe-bottom)); }
          .egg-stage svg { max-height: 30dvh !important; }
          .egg-stage { margin-bottom: 4px !important; }
        }
        @media (prefers-reduced-motion: reduce) {
          * { animation: none !important; transition: none !important; }
        }
      `}</style>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<G04EggX />);
</script>
</body>
</html>
